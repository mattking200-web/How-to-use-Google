<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Ready — Google Workspace Skills Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122031;
  --ink-soft:#3d4f63;
  --paper:#f5f6f4;
  --panel:#ffffff;
  --line:#dde2e2;
  --teal:#0e7c6b;
  --teal-deep:#0a5c4f;
  --teal-tint:#e2f2ee;
  --amber:#c97a1a;
  --amber-tint:#fbeed9;
  --coral:#b3492f;
  --coral-tint:#f8e5df;
  --slate-tint:#eef0ef;
  --radius-sm:4px;
  --radius-md:8px;
  --shadow-card:0 1px 0 rgba(18,32,49,0.06), 0 8px 20px -14px rgba(18,32,49,0.35);
  --focus:0 0 0 3px rgba(14,124,107,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-weight:600;
  line-height:1.15;
  margin:0;
  color:var(--ink);
}
p{margin:0 0 0.75em 0;}
a{color:var(--teal-deep);}
button{font-family:inherit;}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm);}
img{max-width:100%;}

.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;z-index:100;border-radius:var(--radius-sm);}
.skip-link:focus{left:12px;top:12px;}

/* ---- App shell ---- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--ink);
  color:#fff;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:1.05rem;
  color:#fff;text-decoration:none;
  margin-right:auto;
}
.brand-mark{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(135deg,var(--teal) 0%, var(--teal-deep) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.topnav{display:flex;gap:4px;flex-wrap:wrap;}
.topnav button{
  background:transparent;border:1px solid transparent;color:#cfe0dc;
  padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.92rem;
}
.topnav button:hover{background:rgba(255,255,255,0.08);color:#fff;}
.topnav button.active{background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.2);}
.role-pill{
  display:flex;background:rgba(255,255,255,0.08);border-radius:999px;padding:3px;gap:2px;
}
.role-pill button{
  border-radius:999px;padding:6px 14px;font-size:0.85rem;background:transparent;color:#cfe0dc;border:none;cursor:pointer;
}
.role-pill button.active{background:#fff;color:var(--ink);font-weight:600;}

main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:28px 20px 64px;}
.container-wide{max-width:1220px;}

/* ---- Buttons ---- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:var(--radius-sm);
  font-size:0.95rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;
  font-family:'IBM Plex Sans',sans-serif;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-secondary:hover{border-color:var(--ink-soft);}
.btn-ghost{background:transparent;color:var(--teal-deep);border-color:transparent;padding-left:0;padding-right:0;}
.btn-ghost:hover{text-decoration:underline;}
.btn-danger{background:#fff;color:var(--coral);border-color:var(--coral);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 13px;font-size:0.85rem;}

/* ---- Cards & layout helpers ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px;box-shadow:var(--shadow-card);}
.eyebrow{color:var(--teal-deep);font-weight:600;font-size:0.85rem;}
.stack{display:flex;flex-direction:column;gap:16px;}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
@media (max-width:640px){.grid-2{grid-template-columns:1fr;}}

/* ---- Progress bar ---- */
.progress-track{
  height:10px;background:var(--slate-tint);border-radius:2px;overflow:hidden;display:flex;border:1px solid var(--line);
}
.progress-fill{height:100%;background:var(--teal);}
.progress-row{display:flex;align-items:center;gap:12px;}
.progress-row .progress-track{flex:1;}
.progress-pct{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.9rem;min-width:38px;text-align:right;}

/* segmented mastery bar: distinct blocks per skill instead of a smooth gradient bar */
.seg-bar{display:flex;gap:2px;height:14px;}
.seg{flex:1;border-radius:1px;background:var(--slate-tint);border:1px solid var(--line);}
.seg.achieved{background:var(--teal);border-color:var(--teal-deep);}
.seg.pending{background:var(--amber);border-color:#a2650f;}
.seg.needs-practice{background:var(--coral);border-color:#8f3620;}

/* ---- Status chip ---- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:0.78rem;font-weight:600;border:1px solid transparent;}
.chip-not-started{background:var(--slate-tint);color:var(--ink-soft);border-color:var(--line);}
.chip-learning{background:#eaf1fb;color:#2a5a94;border-color:#c6d9f0;}
.chip-pending{background:var(--amber-tint);color:#8a5510;border-color:#eccb92;}
.chip-achieved{background:var(--teal-tint);color:var(--teal-deep);border-color:#b9e0d6;}
.chip-needs-practice{background:var(--coral-tint);color:var(--coral);border-color:#e9bcac;}

/* ---- Skill card ---- */
.skill-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;
}
.skill-card:hover{border-color:var(--teal);}
.skill-card .sk-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1rem;}
.skill-icon{width:34px;height:34px;border-radius:7px;background:var(--teal-tint);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

/* ---- Course map ---- */
.course-map{display:flex;flex-direction:column;gap:0;max-width:640px;margin:0 auto;}
.map-node{
  display:flex;gap:16px;align-items:flex-start;position:relative;padding-bottom:34px;
}
.map-node:last-child{padding-bottom:0;}
.map-node::before{
  content:'';position:absolute;left:23px;top:48px;bottom:0;width:2px;background:var(--line);
}
.map-node:last-child::before{display:none;}
.map-dot{
  width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;
  flex-shrink:0;z-index:1;font-size:1.05rem;color:var(--ink-soft);
}
.map-node.complete .map-dot{background:var(--teal);border-color:var(--teal-deep);color:#fff;}
.map-node.current .map-dot{border-color:var(--teal);color:var(--teal-deep);box-shadow:0 0 0 4px var(--teal-tint);}
.map-node.locked .map-dot{color:#aab3bb;}
.map-body{flex:1;padding-top:6px;}
.map-body h3{font-size:1.05rem;}
.map-body .map-desc{color:var(--ink-soft);font-size:0.9rem;margin-top:2px;}

/* ---- Badges ---- */
.badge{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);
  background:var(--amber-tint);border:1px solid #eccb92;min-width:180px;
}
.badge.locked{background:var(--slate-tint);border-color:var(--line);opacity:0.75;}
.badge-icon{font-size:1.3rem;}
.badge-name{font-weight:600;font-size:0.9rem;}
.badge-sub{font-size:0.75rem;color:var(--ink-soft);}

/* ---- Step list ---- */
.step-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.step-list li{display:flex;gap:12px;align-items:flex-start;}
.step-num{
  width:26px;height:26px;border-radius:50%;background:var(--teal-tint);color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;
  font-family:'Space Grotesk',sans-serif;
}

/* ---- Table (teacher) ---- */
table.class-table{width:100%;border-collapse:collapse;font-size:0.88rem;}
table.class-table th, table.class-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);}
table.class-table th{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--ink-soft);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.03em;}
table.class-table tr:hover td{background:var(--slate-tint);cursor:pointer;}

/* ---- Forms ---- */
label{display:block;font-weight:600;font-size:0.88rem;margin-bottom:6px;}
input[type=text],input[type=url],textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-family:inherit;font-size:0.95rem;background:#fff;color:var(--ink);
}
input:focus,textarea:focus,select:focus{border-color:var(--teal);}

.banner{padding:14px 16px;border-radius:var(--radius-md);border:1px solid;display:flex;gap:10px;align-items:flex-start;}
.banner-info{background:var(--teal-tint);border-color:#b9e0d6;color:var(--teal-deep);}
.banner-lock{background:var(--slate-tint);border-color:var(--line);color:var(--ink-soft);}
.banner-success{background:var(--teal-tint);border-color:#b9e0d6;color:var(--teal-deep);}

.crumb{color:var(--ink-soft);font-size:0.88rem;margin-bottom:14px;}
.crumb button{background:none;border:none;color:var(--teal-deep);cursor:pointer;font-size:0.88rem;padding:0;font-family:inherit;}
.crumb button:hover{text-decoration:underline;}

.divider{height:1px;background:var(--line);margin:22px 0;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}

.certificate{
  background:#fff;border:2px solid var(--ink);border-radius:var(--radius-md);padding:50px 40px;text-align:center;
  background-image:repeating-linear-gradient(135deg, rgba(14,124,107,0.03) 0px, rgba(14,124,107,0.03) 2px, transparent 2px, transparent 14px);
}
.certificate h1{font-size:2rem;margin-bottom:6px;}
.certificate .cert-name{font-size:1.7rem;color:var(--teal-deep);margin:20px 0 6px;font-family:'Space Grotesk',sans-serif;font-weight:700;}

@media print{
  .topbar,.crumb,.no-print{display:none !important;}
  body{background:#fff;}
}
</style>
</head>

<script>

      challenge: {

// Flat lookup: skillId -> {skill, levelId, sectionName}
const SKILL_INDEX = {};
COURSE.levels.forEach(level=>{
  (level.sections||[]).forEach(section=>{
    section.skills.forEach(skill=>{
      SKILL_INDEX[skill.id] = { skill, levelId: level.id, sectionName: section.name, sectionBadge: section.badge, sectionBadgeIcon: section.badgeIcon };
    });
  });
});
function allSkillIdsForLevel(levelId){
  const level = COURSE.levels.find(l=>l.id===levelId);
  if(!level || !level.sections) return [];
  return level.sections.flatMap(s=>s.skills.map(sk=>sk.id));
}
function allSkillIdsForSection(levelId, sectionName){
  const level = COURSE.levels.find(l=>l.id===levelId);
  if(!level || !level.sections) return [];
  const section = level.sections.find(s=>s.name===sectionName);
  return section ? section.skills.map(sk=>sk.id) : [];
}
// Returns the next skill id after skillId within its level (flowing across
// sections, e.g. from the last Docs skill into the first Slides skill), or
// null if skillId is the last skill in the level.
function nextSkillId(levelId, skillId){
  const ids = allSkillIdsForLevel(levelId);
  const idx = ids.indexOf(skillId);
  if(idx===-1 || idx===ids.length-1) return null;
  return ids[idx+1];
}

/* =========================================================================
   TEACHING DIAGRAMS
   Small generic (non-branded) app-mockup illustrations so "click + New"
   actually shows a + New button, not just words. Built from a few reusable
   pieces rather than one bespoke drawing per skill. Colors read from the
   page's own CSS variables so they always match the site theme.
   ========================================================================= */
const DP = {
  ink:'var(--ink)', inkSoft:'var(--ink-soft)', paper:'var(--paper)', panel:'var(--panel)',
  line:'var(--line)', teal:'var(--teal)', tealDeep:'var(--teal-deep)', tealTint:'var(--teal-tint)',
  amber:'var(--amber)', amberTint:'var(--amber-tint)', slateTint:'var(--slate-tint)',
};
function dEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dWrap(text, maxChars){
  const words = text.split(" "); const lines = []; let cur = "";
  words.forEach(w=>{ if((cur+" "+w).trim().length > maxChars){ lines.push(cur.trim()); cur = w; } else cur = (cur+" "+w).trim(); });
  if(cur) lines.push(cur);
  return lines;
}
function dBrowserFrame(x,y,w,h,label){
  const chromeH = 30;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${DP.panel}" stroke="${DP.line}" stroke-width="1.5"/>
    <rect x="${x}" y="${y}" width="${w}" height="${chromeH}" rx="8" fill="${DP.slateTint}"/>
    <rect x="${x}" y="${y+chromeH-8}" width="${w}" height="8" fill="${DP.slateTint}"/>
    <circle cx="${x+16}" cy="${y+15}" r="4" fill="${DP.line}"/><circle cx="${x+30}" cy="${y+15}" r="4" fill="${DP.line}"/><circle cx="${x+44}" cy="${y+15}" r="4" fill="${DP.line}"/>
    <rect x="${x+64}" y="${y+7}" width="200" height="16" rx="8" fill="${DP.panel}" stroke="${DP.line}"/>
    <text x="${x+72}" y="${y+19}" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="${DP.inkSoft}">${dEsc(label)}</text>`;
}
function dSidebarList(x,y,w,h,items,highlightIdx){
  const rowH = Math.min(30, h/items.length);
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${DP.panel}"/><line x1="${x+w}" y1="${y}" x2="${x+w}" y2="${y+h}" stroke="${DP.line}"/>`;
  items.forEach((it,i)=>{
    const ry = y + i*rowH + 6; const on = i===highlightIdx;
    if(on) out += `<rect x="${x+6}" y="${ry-4}" width="${w-12}" height="${rowH-8}" rx="6" fill="${DP.tealTint}"/>`;
    out += `<text x="${x+16}" y="${ry+10}" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="${on?600:400}" fill="${on?DP.tealDeep:DP.inkSoft}">${dEsc(it)}</text>`;
  });
  return out;
}
function dToolbarRow(x,y,buttons){
  let cx = x, out = "";
  buttons.forEach(btn=>{
    const w = 22 + btn.label.length*6.2;
    if(btn.highlight){
      out += `<rect x="${cx}" y="${y}" width="${w}" height="26" rx="13" fill="${DP.teal}"/><text x="${cx+w/2}" y="${y+17}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#fff">${dEsc(btn.label)}</text>`;
    } else {
      out += `<rect x="${cx}" y="${y}" width="${w}" height="26" rx="13" fill="${DP.panel}" stroke="${DP.line}"/><text x="${cx+w/2}" y="${y+17}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="${DP.inkSoft}">${dEsc(btn.label)}</text>`;
    }
    cx += w + 10;
  });
  return out;
}
function dFileGrid(x,y,w,count,highlightIdx,iconType){
  const cols = 4, cellW = w/cols, cellH = 58;
  let out = "";
  for(let i=0;i<count;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const cx = x + col*cellW + cellW/2, cy = y + row*cellH + 30;
    const on = i===highlightIdx;
    if(on) out += `<rect x="${cx-34}" y="${cy-26}" width="68" height="60" rx="8" fill="${DP.tealTint}"/>`;
    if(iconType==="folder"){
      out += `<path d="M${cx-16},${cy-8} h10 l4,5 h18 v18 h-32 z" fill="${on?DP.teal:'#c9cfce'}" stroke="${on?DP.tealDeep:DP.line}"/>`;
    } else {
      out += `<rect x="${cx-13}" y="${cy-14}" width="26" height="32" rx="2" fill="#fff" stroke="${on?DP.teal:DP.line}" stroke-width="1.5"/>
        <line x1="${cx-8}" y1="${cy-6}" x2="${cx+8}" y2="${cy-6}" stroke="${DP.line}"/><line x1="${cx-8}" y1="${cy}" x2="${cx+8}" y2="${cy}" stroke="${DP.line}"/><line x1="${cx-8}" y1="${cy+6}" x2="${cx+4}" y2="${cy+6}" stroke="${DP.line}"/>`;
    }
    out += `<rect x="${cx-24}" y="${cy+20}" width="48" height="8" rx="2" fill="${on?DP.tealTint:DP.slateTint}"/>`;
  }
  return out;
}
function dDropdownMenu(x,y,items,highlightIdx){
  const rowH = 26, w = 150, h = items.length*rowH + 8;
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${DP.panel}" stroke="${DP.line}" stroke-width="1.5" style="filter:drop-shadow(0 3px 6px rgba(18,32,49,0.18))"/>`;
  items.forEach((it,i)=>{
    const ry = y + 4 + i*rowH; const on = i===highlightIdx;
    if(on) out += `<rect x="${x+4}" y="${ry}" width="${w-8}" height="${rowH-2}" rx="5" fill="${DP.tealTint}"/>`;
    out += `<text x="${x+14}" y="${ry+17}" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="${on?600:400}" fill="${on?DP.tealDeep:DP.inkSoft}">${dEsc(it)}</text>`;
  });
  return { svg: out, w, h };
}
function dCalloutBubble(x,y,w,text,arrowTo){
  const lines = dWrap(text, 28); const h = 20 + lines.length*17;
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${DP.ink}"/>`;
  lines.forEach((line,i)=>{ out += `<text x="${x+14}" y="${y+22+i*17}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#fff">${dEsc(line)}</text>`; });
  if(arrowTo){
    const originY = arrowTo.y < y ? y : y+h, originX = x + w/2;
    out += `<line x1="${originX}" y1="${originY}" x2="${arrowTo.x}" y2="${arrowTo.y}" stroke="${DP.ink}" stroke-width="2" stroke-dasharray="3,3"/><circle cx="${arrowTo.x}" cy="${arrowTo.y}" r="4" fill="none" stroke="${DP.ink}" stroke-width="2"/>`;
  }
  return { svg: out, h };
}
function dDialogBox(x,y,w,h,title,fields,primaryBtnLabel,highlightFieldIdx){
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${DP.panel}" stroke="${DP.line}" stroke-width="1.5" style="filter:drop-shadow(0 4px 10px rgba(18,32,49,0.18))"/>
    <text x="${x+18}" y="${y+26}" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="${DP.ink}">${dEsc(title)}</text>
    <line x1="${x}" y1="${y+38}" x2="${x+w}" y2="${y+38}" stroke="${DP.line}"/>`;
  fields.forEach((f,i)=>{
    const fy = y + 54 + i*40; const on = i===highlightFieldIdx;
    out += `<text x="${x+18}" y="${fy}" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="${DP.inkSoft}">${dEsc(f.label)}</text>
      <rect x="${x+18}" y="${fy+6}" width="${w-36}" height="22" rx="5" fill="${on?DP.tealTint:'#fff'}" stroke="${on?DP.teal:DP.line}" stroke-width="${on?2:1}"/>
      <text x="${x+28}" y="${fy+21}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="${DP.inkSoft}">${dEsc(f.value||"")}</text>`;

    const by = y+h-38;
    out += `<rect x="${x+w-100}" y="${by}" width="82" height="26" rx="13" fill="${DP.teal}"/><text x="${x+w-59}" y="${by+17}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#fff">${dEsc(primaryBtnLabel)}</text>`;
  }
  return out;
}
function dAppIconGrid(x,y,labels,highlightIdx){
  const cols = 3, cellW = 76, cellH = 50;
  let out = "";
  labels.forEach((label,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx = x + col*cellW + cellW/2, cy = y + row*cellH + cellH/2;
    const on = i===highlightIdx;
    out += `<rect x="${cx-30}" y="${cy-18}" width="60" height="36" rx="8" fill="${on?DP.teal:DP.slateTint}"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" font-weight="600" fill="${on?'#fff':DP.inkSoft}">${dEsc(label)}</text>`;
  });
  return out;
}
function dStatusPill(x,y,text,tone){
  const w = 24 + text.length*6;
  const bg = tone==="active" ? DP.amberTint : DP.tealTint;
  const fg = tone==="active" ? DP.amber : DP.tealDeep;
  return `<rect x="${x}" y="${y}" width="${w}" height="22" rx="11" fill="${bg}"/><text x="${x+w/2}" y="${y+15}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="${fg}">${dEsc(text)}</text>`;
}
function dSheetGrid(x,y,cols,rows,opts){
  opts = opts||{};
  const colW = 58, rowH = 24, headerH = 22, rowLabelW = 26;
  const colLetters = ["A","B","C","D","E","F"];
  let out = "";
  // formula bar
  out += `<rect x="${x}" y="${y}" width="${rowLabelW+cols*colW}" height="24" fill="${DP.panel}" stroke="${DP.line}"/>
    <text x="${x+6}" y="${y+16}" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="600" fill="${DP.inkSoft}">${dEsc(opts.formulaCell||"A1")}</text>
    <line x1="${x+34}" y1="${y+4}" x2="${x+34}" y2="${y+20}" stroke="${DP.line}"/>
    <text x="${x+42}" y="${y+16}" font-family="'IBM Plex Sans', monospace" font-size="10.5" fill="${opts.formula?DP.tealDeep:DP.inkSoft}">${dEsc(opts.formula||"")}</text>`;
  const gridY = y+24;
  // column headers
  out += `<rect x="${x}" y="${gridY}" width="${rowLabelW}" height="${headerH}" fill="${DP.slateTint}"/>`;
  for(let c=0;c<cols;c++){
    out += `<rect x="${x+rowLabelW+c*colW}" y="${gridY}" width="${colW}" height="${headerH}" fill="${DP.slateTint}" stroke="${DP.panel}"/>
      <text x="${x+rowLabelW+c*colW+colW/2}" y="${gridY+15}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="600" fill="${DP.inkSoft}">${colLetters[c]}</text>`;
  }
  // rows
  for(let r=0;r<rows;r++){
    const ry = gridY+headerH+r*rowH;
    out += `<rect x="${x}" y="${ry}" width="${rowLabelW}" height="${rowH}" fill="${DP.slateTint}" stroke="${DP.panel}"/>
      <text x="${x+rowLabelW/2}" y="${ry+16}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="${DP.inkSoft}">${r+1}</text>`;
    for(let c=0;c<cols;c++){
      const cx = x+rowLabelW+c*colW, cy = ry;
      const cellKey = colLetters[c]+(r+1);
      const isHighlight = (opts.highlightCells||[]).includes(cellKey);
      const value = (opts.values||{})[cellKey];
      out += `<rect x="${cx}" y="${cy}" width="${colW}" height="${rowH}" fill="${isHighlight?DP.tealTint:'#fff'}" stroke="${isHighlight?DP.teal:DP.line}" stroke-width="${isHighlight?2:1}"/>`;
      if(value!==undefined) out += `<text x="${cx+colW-8}" y="${cy+16}" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="${isHighlight?DP.tealDeep:DP.inkSoft}">${dEsc(value)}</text>`;
    }
  }
  return { svg: out, w: rowLabelW+cols*colW, h: 24+headerH+rows*rowH };
}
function dSlideFilmstrip(x,y,h,count,activeIdx,dragging){
  const w = 70, gap = 10;
  let out = "";
  for(let i=0;i<count;i++){
    const sy = y + i*(h+gap);
    const on = i===activeIdx;
    const isDragTarget = dragging && i===dragging.toIdx;
    out += `<rect x="${x}" y="${sy}" width="${w}" height="${h}" rx="4" fill="#fff" stroke="${on?DP.teal:DP.line}" stroke-width="${on?2:1}"/>
      <text x="${x+8}" y="${sy+h/2+4}" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="${DP.inkSoft}">${i+1}</text>`;
    if(isDragTarget) out += `<line x1="${x-4}" y1="${sy-gap/2}" x2="${x+w+4}" y2="${sy-gap/2}" stroke="${DP.teal}" stroke-width="2"/>`;
  }
  if(dragging){
    const fromY = y + dragging.fromIdx*(h+gap);
    const toY = y + (dragging.toIdx-0.5)*(h+gap);
    out += `<rect x="${x}" y="${fromY}" width="${w}" height="${h}" rx="4" fill="${DP.tealTint}" stroke="${DP.teal}" stroke-width="2" stroke-dasharray="4,3" opacity="0.85"/>
      <text x="${x+8}" y="${fromY+h/2+4}" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="${DP.tealDeep}">${dragging.fromIdx+1}</text>
      <line x1="${x+w+14}" y1="${fromY+h/2}" x2="${x+w+14}" y2="${toY}" stroke="${DP.teal}" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M${x+w+9},${toY-6} l5,8 l5,-8 z" fill="${DP.teal}"/>`;
  }
  return { svg: out, w };
}
function dTablePicker(x,y,cols,rows,highlightCols,highlightRows){
  const cell = 22; let out = "";
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const on = c<highlightCols && r<highlightRows;
      out += `<rect x="${x+c*cell}" y="${y+r*cell}" width="${cell-2}" height="${cell-2}" fill="${on?DP.tealTint:'#fff'}" stroke="${on?DP.teal:DP.line}"/>`;
    }
  }
  return { svg: out, w: cols*cell, h: rows*cell };
}
function dVersionTimeline(x,y,entries,highlightIdx){
  const rowH = 34; let out = `<line x1="${x+10}" y1="${y+10}" x2="${x+10}" y2="${y+10+((entries.length-1)*rowH)}" stroke="${DP.line}" stroke-width="2"/>`;
  entries.forEach((e,i)=>{
    const ry = y + i*rowH; const on = i===highlightIdx;
    out += `<circle cx="${x+10}" cy="${ry+10}" r="6" fill="${on?DP.teal:DP.panel}" stroke="${on?DP.tealDeep:DP.line}" stroke-width="2"/>
      <text x="${x+28}" y="${ry+9}" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="${on?600:400}" fill="${on?DP.tealDeep:DP.ink}">${dEsc(e.label)}</text>
      <text x="${x+28}" y="${ry+22}" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="${DP.inkSoft}">${dEsc(e.sub)}</text>`;
  });
  return { svg: out, h: entries.length*rowH };
}
function dSearchResults(x,y,w,results,highlightIdx){
  const rowH = 46; let out = "";
  results.forEach((r,i)=>{
    const ry = y + i*rowH; const on = i===highlightIdx;
    if(on) out += `<rect x="${x-8}" y="${ry-6}" width="${w+16}" height="${rowH-6}" rx="6" fill="${DP.tealTint}"/>`;
    if(r.ad) out += `<rect x="${x}" y="${ry-2}" width="30" height="14" rx="3" fill="${DP.amberTint}"/><text x="${x+15}" y="${ry+8}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="${DP.amber}">AD</text>`;
    out += `<text x="${x+(r.ad?38:0)}" y="${ry+10}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5570c9">${dEsc(r.title)}</text>
      <text x="${x}" y="${ry+26}" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="${DP.inkSoft}">${dEsc(r.snippet)}</text>`;
  });
  return { svg: out, h: results.length*rowH };
}
function dWrapSvg(inner, w, h){

}

  const fn = SKILL_DIAGRAMS[skillId];
  if(!fn) return "";
  return `<div style="max-width:520px;margin:0 auto 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden;">${fn()}</div>`;
}

/* =========================================================================
   STATE
   Everything lives in this browser's localStorage. There is no server, so
   a student's progress only exists on the device they used. Students can
   export a small progress file; teachers import those files to build a
   class view. This is an honest limitation of a no-backend static site.
   ========================================================================= */
const STORAGE_KEY = "workspaceReady_v1";

function blankStudent(name, pinHash){
  return {
    id: "s" + Date.now() + Math.random().toString(36).slice(2,7),
    name: name || "Student",
    pinHash: pinHash || null, // a light deterrent, not real security — see simpleHash()
    createdAt: new Date().toISOString(),
    progress: {},        // skillId -> 'not-started' | 'learning' | 'pending' | 'achieved' | 'needs-practice'
    submissions: {},      // skillId -> {link, note, date}
    challenges: {},       // levelId -> 'not-started' | 'pending' | 'achieved' | 'needs-practice'
    challengeSubmissions: {}, // levelId -> {links:[...], note, date}
    finalProject: { status:"not-started", links:[], note:"", date:null },
    certificateDate: null,
  };
}
// Not cryptography — just stops a PIN sitting as plain text in localStorage
// where a curious student could read it directly. Anyone opening devtools
// and reading the actual app logic could still work around this; it's meant
// to stop casual snooping/self-grading, not a determined technical bypass.
function simpleHash(str){
  let hash = 0;
  const s = String(str);
  for(let i=0;i<s.length;i++){
    hash = ((hash<<5)-hash) + s.charCodeAt(i);
    hash |= 0;
  }
  return hash.toString(36);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.teacherPinHash===undefined) parsed.teacherPinHash = null;
      if(!parsed.teacherRoster) parsed.teacherRoster = [];
      return parsed;
    }
  }catch(e){ console.warn("Could not read saved progress", e); }
  return { students:{}, activeStudentId:null, role:"student", teacherRoster:[], teacherPinHash:null };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

let STATE = loadState();

function activeStudent(){
  return STATE.students[STATE.activeStudentId] || null;
}
function createStudent(name, pin){
  const st = blankStudent(name, pin ? simpleHash(pin) : null);
  STATE.students[st.id] = st;
  STATE.activeStudentId = st.id;
  saveState();
  return st;
}
function switchStudent(id){
  STATE.activeStudentId = id;
  saveState();
}
function setRole(role){
  STATE.role = role;
  saveState();
}

function getSkillStatus(student, skillId){
  return (student && student.progress[skillId]) || "not-started";
}
function setSkillStatus(student, skillId, status){
  student.progress[skillId] = status;
  saveState();
}
function submitSkillEvidence(student, skillId, link, note){
  student.submissions[skillId] = { link: link||"", note: note||"", date: new Date().toISOString() };
  student.progress[skillId] = "pending";
  saveState();
}
function teacherMarkSkill(student, skillId, status){
  student.progress[skillId] = status; // 'achieved' or 'needs-practice'
  saveState();
}

function levelProgress(student, levelId){
  const ids = allSkillIdsForLevel(levelId);
  if(ids.length===0) return {achieved:0,total:0,pct:0};
  const achieved = ids.filter(id=>getSkillStatus(student,id)==="achieved").length;
  return { achieved, total: ids.length, pct: Math.round((achieved/ids.length)*100) };
}
function sectionProgress(student, levelId, sectionName){
  const ids = allSkillIdsForSection(levelId, sectionName);
  if(ids.length===0) return {achieved:0,total:0,pct:0};
  const achieved = ids.filter(id=>getSkillStatus(student,id)==="achieved").length;
  return { achieved, total: ids.length, pct: Math.round((achieved/ids.length)*100) };
}
function sectionBadgeEarned(student, levelId, sectionName){
  const p = sectionProgress(student, levelId, sectionName);
  return p.total>0 && p.achieved===p.total;
}
function levelChallengeStatus(student, levelId){
  return (student && student.challenges[levelId]) || "not-started";
}
function levelBadgeEarned(student, levelId){
  return levelChallengeStatus(student, levelId) === "achieved";
}
function levelUnlocked(student, levelId){
  if(levelId===1) return true;
  return levelBadgeEarned(student, levelId-1);
}
function finalProjectStatus(student){
  return (student && student.finalProject && student.finalProject.status) || "not-started";
}
function courseComplete(student){
  return COURSE.levels.every(l => l.isFinal ? finalProjectStatus(student)==="achieved" : levelBadgeEarned(student,l.id));
}
function overallPct(student){
  const allIds = COURSE.levels.flatMap(l=>allSkillIdsForLevel(l.id));
  if(allIds.length===0) return 0;
  const achieved = allIds.filter(id=>getSkillStatus(student,id)==="achieved").length;
  return Math.round((achieved/allIds.length)*100);
}
function allBadgesEarned(student){
  const badges = [];
  COURSE.levels.forEach(level=>{
    (level.sections||[]).forEach(section=>{
      if(section.badge && sectionBadgeEarned(student, level.id, section.name)){
        badges.push({ name: section.badge, icon: section.badgeIcon||"🏆", levelId: level.id });
      }
    });
    if(!level.isFinal && levelBadgeEarned(student, level.id)){
      badges.push({ name: level.badge, icon: level.badgeIcon||"🏆", levelId: level.id, isLevelBadge:true });
    }
    if(level.isFinal && finalProjectStatus(student)==="achieved"){
      badges.push({ name: level.badge, icon: level.badgeIcon||"🏆", levelId: level.id, isLevelBadge:true });
    }
  });
  return badges;
}
function recentAchievements(student, limit){
  const items = [];
  Object.keys(student.progress).forEach(skillId=>{
    if(student.progress[skillId]==="achieved" && student.submissions[skillId]){
      const info = SKILL_INDEX[skillId];
      if(info) items.push({ title: info.skill.title, date: student.submissions[skillId].date, levelId: info.levelId });
    }
  });
  items.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return items.slice(0, limit||5);
}

function exportStudentFile(student){
  const data = JSON.stringify(student, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (student.name || "student").replace(/[^a-z0-9]+/gi,"_") + "_progress.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importStudentFile(file, callback){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.id || !parsed.progress) throw new Error("This doesn't look like a progress file.");
      const existing = STATE.students[parsed.id];
      if(existing){
        const existingReviewed = Object.values(existing.progress||{}).some(s=>s==="achieved"||s==="needs-practice");
        if(existingReviewed && confirm(`You've already reviewed some of ${existing.name}'s work. Importing this file will overwrite what you've marked so far with this file's data. Continue?`) === false){
          callback(new Error("Import cancelled."));
          return;
        }
      }
      STATE.teacherRoster = STATE.teacherRoster.filter(id=>id!==parsed.id);
      STATE.teacherRoster.push(parsed.id);
      STATE.students[parsed.id] = parsed;
      saveState();
      callback(null, parsed);
    }catch(err){
      callback(err);
    }
  };
  reader.onerror = ()=>callback(new Error("Could not read that file."));
  reader.readAsText(file);
}

/* =========================================================================
   RENDER HELPERS
   ========================================================================= */
function esc(str){
  const d = document.createElement("div");
  d.textContent = str==null ? "" : String(str);
  return d.innerHTML;
}
// Only ever use a submitted "link" as a clickable href if it's actually http(s).
// Without this, a pasted javascript: URI would sit in an <a href> and could run
// script when clicked (e.g. after a teacher imports a student's file).
function safeUrl(url){
  if(typeof url !== "string") return "#";
  const trimmed = url.trim();
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return "#";
}
function chip(status){
  const labels = {
    "not-started":"Not started",
    "learning":"Learning",
    "pending":"Waiting for check",
    "achieved":"Achieved",
    "needs-practice":"Needs practice"
  };
  const icons = { "not-started":"○", "learning":"◐", "pending":"⏳", "achieved":"✓", "needs-practice":"↻" };
  return `<span class="chip chip-${status}">${icons[status]||"○"} ${labels[status]||status}</span>`;
}
function segBar(student, skillIds){
  return `<div class="seg-bar" role="img" aria-label="${skillIds.filter(id=>getSkillStatus(student,id)==='achieved').length} of ${skillIds.length} skills achieved">` +
    skillIds.map(id=>{
      const st = getSkillStatus(student,id);
      const cls = st==="achieved" ? "achieved" : st==="pending" ? "pending" : st==="needs-practice" ? "needs-practice" : "";
      return `<div class="seg ${cls}"></div>`;
    }).join("") + `</div>`;
}
function progressBar(pct){
  return `<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-pct">${pct}%</span></div>`;
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function go(hash){ location.hash = hash; }
function crumbNav(items){
  // items: [{label, hash}] last one is current (no link)
  return `<div class="crumb">` + items.map((it,i)=>{
    if(i===items.length-1) return `<span>${esc(it.label)}</span>`;
    return `<button data-nav="${it.hash}">${esc(it.label)}</button> <span aria-hidden="true">/</span> `;
  }).join("") + `</div>`;
}

/* =========================================================================

   ========================================================================= */
function renderSkill(skillId){
  const info = SKILL_INDEX[skillId];
  const student = activeStudent();
  if(!info || !student) { go("#/dashboard"); return renderDashboard(); }
  const { skill, levelId, sectionName } = info;
  if(!levelUnlocked(student, levelId)){
    return `
    <main id="main">
      ${crumbNav([{label:"Dashboard",hash:"#/dashboard"},{label:skill.title}])}
      <div class="banner banner-lock"><span>🔒</span><div><strong>This level is locked.</strong><p style="margin:4px 0 0;">Finish Level ${levelId-1}'s challenge first to unlock this skill.</p></div></div>
    </main>`;
  }
  const status = getSkillStatus(student, skillId);
  const submission = student.submissions[skillId];
  const nextId = nextSkillId(levelId, skillId);
  const nextBtn = nextId
    ? `<button class="btn btn-primary btn-sm" data-nav="#/skill/${nextId}">Next skill →</button>`
    : `<button class="btn btn-primary btn-sm" data-nav="#/level/${levelId}">Back to Level ${levelId} overview →</button>`;

  const watchSteps = skill.watch.map((step,i)=>`<li><span class="step-num">${i+1}</span><span>${esc(step)}</span></li>`).join("");

  let demonstrateBlock = "";
  if(status==="achieved"){
    demonstrateBlock = `<div class="banner banner-success"><span>✓</span><div><strong>Skill Achieved</strong><p style="margin:4px 0 0;">Nice work — this one's locked in. You can revisit the lesson any time.</p></div></div>
      <div class="row" style="margin-top:12px;">${nextBtn}</div>`;
  } else if(status==="pending"){
    demonstrateBlock = `
      <div class="banner banner-info"><span>⏳</span><div><strong>Waiting for your teacher to check this.</strong>${submission&&submission.note?`<p style="margin:4px 0 0;">You wrote: "${esc(submission.note)}"</p>`:""}${submission&&submission.link?`<p style="margin:4px 0 0;">Link submitted: <a href="${esc(safeUrl(submission.link))}" target="_blank" rel="noopener noreferrer">${esc(submission.link)}</a></p>`:""}</div></div>
      <div class="row" style="margin-top:12px;align-items:center;">${nextBtn}<button class="btn btn-ghost btn-sm" id="undo-submit">Undo and try again</button></div>`;
  } else if(status==="needs-practice"){
    demonstrateBlock = `
      <div class="banner" style="background:var(--coral-tint);border-color:#e9bcac;color:var(--coral);"><span>↻</span><div><strong>Needs another try — that's completely normal.</strong><p style="margin:4px 0 0;">Review the steps above, then try again. Mastery, not speed.</p></div></div>
      ${demonstrateForm(skill)}`;
  } else {
    demonstrateBlock = demonstrateForm(skill);
  }

  return `
  <main id="main">
    ${crumbNav([{label:"Dashboard",hash:"#/dashboard"},{label:"Level "+levelId,hash:"#/level/"+levelId},{label:skill.title}])}
    <p class="eyebrow">${esc(sectionName)}</p>
    <h1 style="font-size:1.5rem;margin-bottom:18px;">${esc(skill.title)}</h1>

    <div class="stack">
      <div class="card">
        <p class="eyebrow" style="margin-bottom:8px;">1. Learn</p>
        <p style="margin:0;">${esc(skill.learn)}</p>
      </div>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:10px;">2. Watch / See it</p>
        ${renderSkillDiagram(skillId)}
        <ol class="step-list" style="list-style:none;">${watchSteps}</ol>
      </div>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:8px;">3. Try it</p>
        <p style="margin:0 0 12px;">${esc(skill.tryIt)}</p>
        ${status==="not-started" ? `<button class="btn btn-secondary btn-sm" id="mark-tried">I tried it — take me to Show What You Know</button>` : `<span class="chip chip-achieved" style="background:var(--slate-tint);color:var(--ink-soft);border-color:var(--line);">✓ Practice logged</span>`}
      </div>

}

/* =========================================================================
   TEACHER DASHBOARD
   ========================================================================= */
function renderTeacherDashboard(){
  // Any student created on this device is already visible here. Import is only
  // needed to bring in a student who did the course on a different device/browser.
  const roster = Object.values(STATE.students).sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  const pendingCount = roster.reduce((sum,st)=>{
    let n = Object.values(st.progress).filter(s=>s==="pending").length;
    n += Object.values(st.challenges).filter(s=>s==="pending").length;
    if(finalProjectStatus(st)==="pending") n++;
    return sum+n;
  },0);

  const rows = roster.map(st=>{
    const cells = COURSE.levels.map(level=>{
      if(level.isFinal){
        const s = finalProjectStatus(st);
        return `<td>${s==="achieved" ? "✓" : s==="pending" ? "⏳" : s==="needs-practice" ? "↻" : "—"}</td>`;
      }
      const complete = levelBadgeEarned(st, level.id);
      const p = levelProgress(st, level.id);
      if(complete) return `<td>✓</td>`;
      if(p.achieved===0) return `<td>—</td>`;
      return `<td>${p.achieved}/${p.total}</td>`;
    }).join("");
    return `<tr data-nav="#/teacher/student/${st.id}" tabindex="0" role="button" aria-label="View ${esc(st.name)}'s details"><td><strong>${esc(st.name)}</strong></td>${cells}<td>${overallPct(st)}%</td></tr>`;
  }).join("");

  return `
  <main id="main" class="container-wide">
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
      <div>
        <p class="eyebrow">Teacher Dashboard</p>
        <h1 style="font-size:1.6rem;">Class overview</h1>
      </div>
      <div class="row">
        ${pendingCount>0 ? `<span class="chip chip-pending">⏳ ${pendingCount} item${pendingCount===1?'':'s'} to review</span>` : ""}
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;">Import from another device<input type="file" id="import-file" accept="application/json" style="display:none;"></label>
      </div>
    </div>
    ${roster.length ? `
    <div class="card" style="overflow-x:auto;">
      <table class="class-table">
        <thead><tr><th>Student</th>${COURSE.levels.map(l=>`<th>Lvl ${l.id}</th>`).join("")}<th>Overall</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ` : `
    <div class="empty-state card">
      <p style="font-size:1.05rem;font-weight:600;color:var(--ink);">No students yet on this device</p>
      <p>Students who use the course on this device will show up here automatically. If a student worked on a different device, have them click "Export my progress file" on their dashboard, then import that file here with the button above.</p>
    </div>`}
  </main>`;
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseHash(){
  const h = location.hash.replace(/^#\//,"");
  const parts = h.split("/").filter(Boolean);
  return { top: parts[0]||"", parts, name: parts[0]||"" };
}

function render(){
  const r = parseHash();
  let bodyHtml = "";

  // Teacher-only routes short-circuit role handling
  if(STATE.role==="teacher"){
    if(r.top==="teacher" && r.parts[1]==="student" && r.parts[2]){
      bodyHtml = renderTeacherStudent(r.parts[2]);
    } else {
      if(location.hash!=="#/teacher") location.hash = "#/teacher";
      bodyHtml = renderTeacherDashboard();
    }
    document.getElementById("app").innerHTML = renderTopbar() + bodyHtml;
    wireEvents();
    return;
  }

  // Student role
  if(!activeStudent() || r.top==="switch-student" || r.top===""){
    document.getElementById("app").innerHTML = renderTopbar() + renderStudentPicker();
    wireEvents();
    return;
  }

  switch(r.top){
    case "dashboard": bodyHtml = renderDashboard(); break;
    case "course-map": bodyHtml = renderCourseMap(); break;
    case "level": bodyHtml = renderLevel(parseInt(r.parts[1],10)); break;
    case "skill": bodyHtml = renderSkill(r.parts[1]); break;
    case "challenge": bodyHtml = renderChallenge(parseInt(r.parts[1],10)); break;
    case "final": bodyHtml = renderFinal(); break;
    case "certificate": bodyHtml = renderCertificate(); break;
    default: bodyHtml = renderDashboard();
  }
  document.getElementById("app").innerHTML = renderTopbar() + bodyHtml;
  wireEvents();
}

/* =========================================================================
   EVENT WIRING (delegated, re-run after every render)
   ========================================================================= */
function wireEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=> go(el.getAttribute("data-nav")));
    // Elements like <tr> aren't natively keyboard-activatable even with tabindex,
    // so give anything non-button a keydown handler for Enter/Space.
    if(el.tagName!=="BUTTON"){
      el.addEventListener("keydown",(e)=>{
        if(e.key==="Enter" || e.key===" "){
          e.preventDefault();
          go(el.getAttribute("data-nav"));
        }
      });
    }
  });
  document.querySelectorAll("[data-role]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const target = el.getAttribute("data-role");
      if(target==="teacher" && STATE.role!=="teacher"){
        if(!STATE.teacherPinHash){
          const pin = prompt("Set a teacher code (4+ digits) so students can't switch into Teacher mode themselves. You'll enter this each time you switch.");
          if(!pin) return;
          const confirmPin = prompt("Type it again to confirm:");
          if(pin !== confirmPin){ alert("Those didn't match — click Teacher again to try once more."); return; }
          STATE.teacherPinHash = simpleHash(pin);
          saveState();
        } else {
          const attempt = prompt("Enter your teacher code:");
          if(attempt===null) return;
          if(simpleHash(attempt) !== STATE.teacherPinHash){ alert("That code isn't right."); return; }
        }
      }
      setRole(target);
      location.hash = target==="teacher" ? "#/teacher" : "#/dashboard";
      render();
    });
  });
  document.querySelectorAll("tr[data-nav]").forEach(el=>{
    el.style.cursor="pointer";
  });

  const continueBtn = document.getElementById("continue-student-btn");
  if(continueBtn) continueBtn.addEventListener("click", ()=>{
    const sel = document.getElementById("student-select");
    const pinInput = document.getElementById("student-pin");
    const errorEl = document.getElementById("continue-error");
    const showError = (msg)=>{ errorEl.textContent = msg; errorEl.style.display = "block"; };
    if(!sel.value){ showError("Choose your name from the list first."); return; }
    const student = STATE.students[sel.value];
    const pin = pinInput.value.trim();
    if(student.pinHash){
      if(!pin){ showError("Enter your 4-digit code."); pinInput.focus(); return; }
      if(simpleHash(pin) !== student.pinHash){ showError("That code doesn't match. Try again, or ask your teacher to reset it."); pinInput.value=""; pinInput.focus(); return; }
    }
    switchStudent(sel.value); go("#/dashboard"); render();
  });
  const newBtn = document.getElementById("new-student-btn");
  if(newBtn) newBtn.addEventListener("click", ()=>{
    const nameInput = document.getElementById("new-student-name");
    const pinInput = document.getElementById("new-student-pin");
    const pinConfirmInput = document.getElementById("new-student-pin-confirm");
    const errorEl = document.getElementById("new-error");
    const showError = (msg)=>{ errorEl.textContent = msg; errorEl.style.display = "block"; };
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    const pinConfirm = pinConfirmInput.value.trim();
    if(!name){ showError("Type your name first."); nameInput.focus(); return; }
    if(!/^\d{4}$/.test(pin)){ showError("Your code should be exactly 4 digits."); pinInput.focus(); return; }
    if(pin !== pinConfirm){ showError("Those two codes don't match — try typing it again."); pinConfirmInput.value=""; pinConfirmInput.focus(); return; }
    createStudent(name, pin);
    go("#/dashboard"); render();
  });

  const exportBtn = document.getElementById("export-btn");
  if(exportBtn) exportBtn.addEventListener("click", ()=> exportStudentFile(activeStudent()));

  const setPinBtn = document.getElementById("set-pin-btn");
  if(setPinBtn) setPinBtn.addEventListener("click", ()=>{
    const pin = prompt("Choose a 4-digit code so only you can access your work:");
    if(!pin) return;
    if(!/^\d{4}$/.test(pin)){ alert("Your code should be exactly 4 digits."); return; }
    const confirmPin = prompt("Type it again to confirm:");
    if(pin !== confirmPin){ alert("Those didn't match — click Set a code to try again."); return; }
    activeStudent().pinHash = simpleHash(pin);
    saveState();
    render();
  });

  const markTried = document.getElementById("mark-tried");
  if(markTried) markTried.addEventListener("click", ()=>{
    const skillId = parseHash().parts[1];
    setSkillStatus(activeStudent(), skillId, "learning");
    render();
  });

  const demoForm = document.getElementById("demonstrate-form");
  if(demoForm) demoForm.addEventListener("submit",(e)=>{
    e.preventDefault();
    const skillId = parseHash().parts[1];
    const note = document.getElementById("demo-note").value.trim();
    const link = document.getElementById("demo-link").value.trim();
    submitSkillEvidence(activeStudent(), skillId, link, note);
    render();
  });
  const undoSubmit = document.getElementById("undo-submit");
  if(undoSubmit) undoSubmit.addEventListener("click", ()=>{
    const skillId = parseHash().parts[1];
    setSkillStatus(activeStudent(), skillId, "learning");
    render();
  });

  const challengeForm = document.getElementById("challenge-form");
  if(challengeForm) challengeForm.addEventListener("submit",(e)=>{
    e.preventDefault();
    const levelId = parseInt(parseHash().parts[1],10);
    const note = document.getElementById("challenge-note").value.trim();
    const link = document.getElementById("challenge-link").value.trim();
    const student = activeStudent();
    student.challengeSubmissions[levelId] = { link, note, date: new Date().toISOString() };
    student.challenges[levelId] = "pending";
    saveState();
    render();
  });
  const undoChallenge = document.getElementById("undo-challenge");
  if(undoChallenge) undoChallenge.addEventListener("click", ()=>{
    const levelId = parseInt(parseHash().parts[1],10);
    activeStudent().challenges[levelId] = "not-started";
    saveState(); render();
  });

  const finalForm = document.getElementById("final-form");
  if(finalForm) finalForm.addEventListener("submit",(e)=>{
    e.preventDefault();
    const note = document.getElementById("final-note").value.trim();
    const linksRaw = document.getElementById("final-link").value.trim();
    const links = linksRaw.split(",").map(s=>s.trim()).filter(Boolean);
    const student = activeStudent();
    student.finalProject = { status:"pending", links, note, date: new Date().toISOString() };
    saveState();
    render();
  });
  const undoFinal = document.getElementById("undo-final");
  if(undoFinal) undoFinal.addEventListener("click", ()=>{
    activeStudent().finalProject.status = "not-started";
    saveState(); render();
  });

  const importFile = document.getElementById("import-file");
  if(importFile) importFile.addEventListener("change",(e)=>{
    const file = e.target.files[0];
    if(!file) return;
    importStudentFile(file, (err)=>{
      if(err){ alert("Import failed: " + err.message); return; }
      render();
    });
  });

  document.querySelectorAll("[data-verify-skill]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const skillId = el.getAttribute("data-verify-skill");
      const status = el.getAttribute("data-verify-status");
      const student = STATE.students[parseHash().parts[2]];
      teacherMarkSkill(student, skillId, status);
      render();
    });
  });
  document.querySelectorAll("[data-verify-challenge]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const levelId = parseInt(el.getAttribute("data-verify-challenge"),10);
      const status = el.getAttribute("data-verify-status");
      const student = STATE.students[parseHash().parts[2]];
      student.challenges[levelId] = status;
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-verify-final]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const status = el.getAttribute("data-verify-final");
      const student = STATE.students[parseHash().parts[2]];
      student.finalProject.status = status;
      saveState();
      render();
    });
  });

  const resetPinBtn = document.getElementById("reset-student-pin");
  if(resetPinBtn) resetPinBtn.addEventListener("click", ()=>{
    const student = STATE.students[parseHash().parts[2]];
    if(!student) return;
    if(confirm(`Clear ${student.name}'s code? They'll be able to set a new one next time they log in.`)){
      student.pinHash = null;
      saveState();
      alert(`${student.name}'s code has been cleared.`);
    }
  });
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
